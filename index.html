<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nuestro Futuro Hogar</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#1c3041;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#123b50;color:white;padding:22px 18px}header .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:1.5rem}header p{margin:5px 0 0;color:#cce3e8}.container{max-width:1050px;margin:auto;padding:20px 15px}.panel,.property{background:white;border-radius:16px;padding:20px;box-shadow:0 3px 20px #142e4510;margin-bottom:16px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:12px;border:1px solid #cad5df;border-radius:10px;background:white}textarea{min-height:85px;resize:vertical}label{font-size:.9rem;font-weight:600;display:block;margin:12px 0 5px}button{border:0;border-radius:10px;padding:11px 17px;cursor:pointer;font-weight:650;background:#167b73;color:white}button.secondary{background:#e7eff3;color:#204354}button.danger{background:#b13a3a}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 15px}.wide{grid-column:1/-1}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.toolbar input{flex:1;min-width:160px}.toolbar select{width:auto}.property h3{margin:0 0 8px}.meta{color:#637788;font-size:.9rem}.property p{white-space:pre-wrap;overflow-wrap:anywhere}.links a{display:inline-block;margin:4px 8px 4px 0;color:#096d82;overflow-wrap:anywhere}.pill{display:inline-block;border-radius:99px;padding:5px 12px;font-weight:700;font-size:.85rem}.ok{background:#d8f4df;color:#14652a}.descartado{background:#ffe0e0;color:#a11c1c}.pendiente{background:#fff0bd;color:#795700}.card-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}.status-buttons{display:flex;gap:6px;flex-wrap:wrap}.status-buttons button{padding:7px 10px;background:#e9edf0;color:#263e4c}.status-buttons button.active{outline:2px solid #167b73}.hidden{display:none!important}.error{color:#a11c1c}.notice{color:#476478;font-size:.92rem}#login{max-width:430px;margin:55px auto}.empty{text-align:center;color:#637788;padding:35px}.loader{padding:30px;text-align:center}@media(max-width:600px){.grid{grid-template-columns:1fr}.container{padding:12px}header{padding:18px 13px}.panel,.property{padding:16px}.toolbar select{flex:1}}
</style></head><body>
<header><div class="container wrap"><div><h1>🏡 Nuestro Futuro Hogar</h1><p>Nuestras casas y terrenos, en un solo lugar</p></div><button id="logout" class="secondary hidden">Cerrar sesión</button></div></header>
<main class="container"><section id="setup" class="panel hidden"><h2>Conectar Supabase</h2><p class="notice">Configurá la dirección y la clave pública de Supabase dentro del archivo index.html antes de publicarlo.</p></section>
<section id="login" class="panel hidden"><h2>Ingresar</h2><form id="loginForm"><label>Correo electrónico</label><input id="email" type="email" required autocomplete="username"><label>Contraseña</label><input id="password" type="password" required autocomplete="current-password"><p id="loginError" class="error" role="alert"></p><button type="submit">Entrar</button></form></section>
<section id="app" class="hidden"><div class="toolbar"><button id="add">+ Agregar propiedad</button><input id="search" placeholder="Buscar por país, ubicación o descripción"><select id="filter"><option value="todos">Todos los estados</option><option value="pendiente">🟡 Pendientes</option><option value="ok">🟢 OK</option><option value="descartado">🔴 Descartados</option></select><button id="refresh" class="secondary">Actualizar</button></div><div id="message" class="notice" role="status"></div><section id="editor" class="panel hidden"><h2 id="editorTitle">Agregar propiedad</h2><form id="propertyForm"><div class="grid"><div><label>Tipo</label><select id="tipo"><option value="Casa">Casa</option><option value="Terreno">Terreno</option></select></div><div><label>País</label><input id="pais" required placeholder="Ej.: Argentina"></div><div class="wide"><label>Ubicación</label><input id="ubicacion" placeholder="Ciudad, barrio, dirección"></div><div class="wide"><label>Teléfono de contacto</label><input id="telefono" type="tel" placeholder="Con código de país"></div><div class="wide"><label>Descripción</label><textarea id="descripcion" placeholder="Precio, superficie, detalles..."></textarea></div><div class="wide"><label>Observaciones</label><textarea id="observaciones" placeholder="Consultas, respuestas, dudas..."></textarea></div><div class="wide"><label>Enlaces (uno por línea)</label><textarea id="links" placeholder="https://..."></textarea></div><div><label>Estado</label><select id="estado"><option value="pendiente">🟡 Pendiente</option><option value="ok">🟢 OK</option><option value="descartado">🔴 Descartado</option></select></div></div><p id="saveError" class="error" role="alert"></p><div class="toolbar"><button type="submit" id="save">Guardar propiedad</button><button type="button" id="cancel" class="secondary">Cancelar</button></div></form></section><div id="properties"></div></section></main>
<script>
// Reemplazar SOLO estos dos valores por los datos públicos de tu proyecto.
const SUPABASE_URL = 'https://gylbmogvrhurrcgzfcdm.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_s_lJSNigcmailbQ5UU7ZAA_K4nk2SjS';
const $=id=>document.getElementById(id);
let db, items=[], editing=null, channel;
const authorizedStates=['pendiente','ok','descartado'];
const show=(id,yes)=>$(id).classList.toggle('hidden',!yes);
function message(t){$('message').textContent=t||''}
function safeLinks(value){if(Array.isArray(value))return value.filter(x=>typeof x==='string');if(value&&Array.isArray(value.urls))return value.urls.filter(x=>typeof x==='string');return []}
function validLink(s){try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}
function make(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function clearEditor(){editing=null;$('propertyForm').reset();$('estado').value='pendiente';$('saveError').textContent='';$('editorTitle').textContent='Agregar propiedad'}
function openEditor(item){clearEditor();if(item){editing=item.id;$('editorTitle').textContent='Editar propiedad';for(const key of ['tipo','pais','ubicacion','telefono','descripcion','observaciones','estado'])$(key).value=item[key]|| (key==='estado'?'pendiente':'');$('links').value=safeLinks(item.links).join('\n')}show('editor',true);$('editor').scrollIntoView({behavior:'smooth'})}
function render(){const q=$('search').value.toLowerCase().trim(),filter=$('filter').value;const filtered=items.filter(p=>(filter==='todos'||p.estado===filter)&&[p.tipo,p.pais,p.ubicacion,p.descripcion,p.observaciones,p.telefono].some(v=>String(v||'').toLowerCase().includes(q)));$('properties').replaceChildren();if(!filtered.length){$('properties').append(make('div','No hay propiedades para mostrar.','panel empty'));return}for(const p of filtered){const card=make('article',undefined,'property');const title=make('h3',(p.tipo||'Propiedad')+' · '+(p.ubicacion||'Sin ubicación'));card.append(title,make('div',p.pais||'País no indicado','meta'));if(p.telefono){const line=make('p');line.append(make('strong','Teléfono: '));const a=make('a',p.telefono);a.href='tel:'+p.telefono.replace(/[^+\d]/g,'');line.append(a);card.append(line)}for(const key of ['descripcion','observaciones'])if(p[key]){const para=make('p');para.append(make('strong',key==='descripcion'?'Descripción: ':'Observaciones: '),document.createTextNode(p[key]));card.append(para)}const links=make('div',undefined,'links');safeLinks(p.links).forEach((l,i)=>{const url=validLink(l);if(!url)return;const a=make('a','🔗 Enlace '+(i+1));a.href=url;a.target='_blank';a.rel='noopener noreferrer';links.append(a)});card.append(links);const actions=make('div',undefined,'card-actions');const badge=make('span',p.estado==='ok'?'✓ OK':p.estado==='descartado'?'✕ Descartado':'● Pendiente','pill '+(authorizedStates.includes(p.estado)?p.estado:'pendiente'));actions.append(badge);const buttons=make('div',undefined,'status-buttons');for(const [state,label] of [['ok','✓ OK'],['pendiente','● Pendiente'],['descartado','✕ Descartado']]){const b=make('button',label,p.estado===state?'active':'');b.type='button';b.onclick=()=>changeStatus(p,state);buttons.append(b)}const edit=make('button','Editar','secondary');edit.type='button';edit.onclick=()=>openEditor(p);buttons.append(edit);actions.append(buttons);card.append(actions);$('properties').append(card)}}
async function load(){message('Actualizando propiedades...');const {data,error}=await db.from('propiedades').select('*').order('created_at',{ascending:false});if(error){message('No se pudieron cargar: '+error.message);return}items=data||[];message(items.length+' propiedades registradas');render()}
async function changeStatus(p,state){if(!authorizedStates.includes(state))return;const {error}=await db.from('propiedades').update({estado:state}).eq('id',p.id);if(error)message('Error al cambiar estado: '+error.message);else await load()}
async function sessionUI(session){const logged=!!session;show('login',!logged);show('app',logged);show('logout',logged);if(logged){await load();if(!channel){channel=db.channel('propiedades-cambios').on('postgres_changes',{event:'*',schema:'public',table:'propiedades'},()=>load()).subscribe()}}else{items=[];if(channel){await db.removeChannel(channel);channel=null}}}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)$('loginError').textContent='No se pudo ingresar: '+error.message};
$('logout').onclick=()=>db.auth.signOut();$('add').onclick=()=>openEditor(null);$('cancel').onclick=()=>{show('editor',false);clearEditor()};$('refresh').onclick=load;$('search').oninput=render;$('filter').onchange=render;
$('propertyForm').onsubmit=async e=>{e.preventDefault();$('saveError').textContent='';const payload={tipo:$('tipo').value,pais:$('pais').value.trim(),ubicacion:$('ubicacion').value.trim(),telefono:$('telefono').value.trim(),descripcion:$('descripcion').value.trim(),observaciones:$('observaciones').value.trim(),links:$('links').value.split('\n').map(x=>x.trim()).filter(Boolean),estado:$('estado').value};if(payload.links.some(x=>!validLink(x))){$('saveError').textContent='Los enlaces deben comenzar con https:// o http://';return}const save=$('save');save.disabled=true;const result=editing===null?await db.from('propiedades').insert(payload):await db.from('propiedades').update(payload).eq('id',editing);save.disabled=false;if(result.error){$('saveError').textContent=result.error.message;return}show('editor',false);clearEditor();await load()};
(async()=>{if(SUPABASE_PUBLISHABLE_KEY.startsWith('PEGA_AQUI')){show('setup',true);return}db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);db.auth.onAuthStateChange((_event,session)=>{setTimeout(()=>sessionUI(session),0)});const {data}=await db.auth.getSession();await sessionUI(data.session)})();
</script></body></html>
